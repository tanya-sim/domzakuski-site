<style>

  html,body{height:100%}
  body{

  }

    font-size:clamp(26px,4.6vw,44px);
    font-weight:400;
    margin:clamp(30px,5vw,48px) 0 0;
    letter-spacing:.01em;
  }
  footer{
    padding:0 24px clamp(34px,5vw,52px);
  }
  footer ul{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px clamp(20px,4vw,36px);
    margin:0;padding:0;list-style:none;
    font-size:16px;
  }
  footer a{
    color:var(--ink);
    text-decoration-color:rgba(196,58,42,.55);
    text-decoration-thickness:1px;
    text-underline-offset:5px;
  }
  footer a:hover{color:var(--thread)}
  footer a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}
  footer .fine{margin:22px 0 0;font-size:14px;color:var(--muted)}
